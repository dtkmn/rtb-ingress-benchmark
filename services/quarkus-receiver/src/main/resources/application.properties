quarkus.http.port=8080
quarkus.http.access-log.enabled=false
quarkus.log.level=INFO

# ======================================================
# DEFAULT (DEV MODE) - Uses In-Memory for fast local dev
# ======================================================
#mp.messaging.outgoing.bid-stream.connector=smallrye-in-memory
#mp.messaging.outgoing.bid-stream.topic=bids

# ======================================================
# PRODUCTION (DOCKER/K8S) - Uses Real Kafka
# ======================================================
# '%prod' activates when running the built JAR or Native executable
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
benchmark.delivery.mode=${BENCHMARK_DELIVERY_MODE:confirm}
benchmark.kafka.topic=${BENCHMARK_KAFKA_TOPIC:bids}
benchmark.kafka.acks=${BENCHMARK_KAFKA_ACKS:1}
benchmark.kafka.linger.ms=${BENCHMARK_KAFKA_LINGER_MS:10}
benchmark.kafka.batch.bytes=${BENCHMARK_KAFKA_BATCH_BYTES:131072}
benchmark.kafka.request.timeout.ms=${BENCHMARK_KAFKA_REQUEST_TIMEOUT_MS:5000}
benchmark.kafka.retries=${BENCHMARK_KAFKA_RETRIES:5}
benchmark.kafka.retry.backoff.ms=${BENCHMARK_KAFKA_RETRY_BACKOFF_MS:100}
benchmark.kafka.producer.pool.size=${BENCHMARK_KAFKA_PRODUCER_POOL_SIZE:1}
benchmark.kafka.send.buffer.bytes=-1
benchmark.kafka.receive.buffer.bytes=-1

# Bound actual streamed bodies before Jackson; preparation is reserved before this handler.
quarkus.http.limits.max-body-size=65536
quarkus.http.body.preallocate-body-buffer=false

# This artifact is fixed controlled. Runtime operational requests are rejected.
quarkus.otel.enabled=false
quarkus.micrometer.enabled=false
# Existing harness knob mapped to the supported Vert.x group setting.
quarkus.vertx.event-loops-pool-size=${QUARKUS_HTTP_IO_THREADS:2}
