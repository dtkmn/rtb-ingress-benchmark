# Loaded only by the Maven native profile, for both direct and Docker builds.
# Mandrel 25 cannot compile Zstd 1.5.7-20's Java 22 FFM overlay. Exclude only
# these classes from the native packaging copy so the same patched JAR uses
# its API-equivalent JNI implementation. Its manifest, base classes and native
# libraries stay intact; regular JVM builds retain the FFM implementation.
# Recheck this list when upgrading Zstd or Mandrel.
# https://github.com/luben/zstd-jni/blob/v1.5.7-20/README.md#foreign-function--memory-api
quarkus.class-loading.removed-resources."com.github.luben\:zstd-jni"=\
    META-INF/versions/22/com/github/luben/zstd/ZstdBinding.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdBinding$FrameProgressionBuffer.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdBinding$SizeTRef.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdBinding$SizeTRef$Narrow.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdBinding$SizeTRef$Wide.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdBufferDecompressingStreamNoFinalizer.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdCompressCtx.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdDirectBufferCompressingStreamNoFinalizer.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdDirectBufferDecompressingStreamNoFinalizer.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdInputStreamNoFinalizer.class,\
    META-INF/versions/22/com/github/luben/zstd/ZstdOutputStreamNoFinalizer.class
