# --- Quarkus App Config ---
# Set a unique app name for Kafka Streams
quarkus.application.name=adtech-sinker
quarkus.application.version=1.0.0

# --- Kafka Streams Config ---
# 1. The Kafka Broker
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# 2. The ID for this processing topology
# This also becomes the Consumer Group ID
quarkus.kafka-streams.application-id=adtech-sinker-processor
# 3. Where to start reading if it's a new app
kafka-streams.auto.offset.reset=earliest
# 4. Topic names; the topology supplies its BidRequest serde explicitly.
kafka-streams.topics-in=${BENCHMARK_KAFKA_TOPIC:bids}
kafka-streams.topics-dlq=${KAFKA_DLQ_TOPIC:bids-dlq}
quarkus.kafka-streams.topics=${kafka-streams.topics-in},${kafka-streams.topics-dlq}
sinker.dlq.enabled=${SINKER_DLQ_ENABLED:false}


# --- Database Config ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:user}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adtech_db}

# --- Hibernate Config ---
# Automatically create/update the tables based on our @Entity
quarkus.hibernate-orm.schema-management.strategy=update

# --- Dead Letter Queue (DLQ) Config ---
mp.messaging.outgoing.dlq-out.connector=smallrye-kafka
mp.messaging.outgoing.dlq-out.topic=${kafka-streams.topics-dlq}
mp.messaging.outgoing.dlq-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
