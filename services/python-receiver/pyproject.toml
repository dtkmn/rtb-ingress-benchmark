[project]
name = "python-receiver"
version = "0.1.0"
description = "Adtech benchmark receiver (Python/FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "aiokafka==0.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
