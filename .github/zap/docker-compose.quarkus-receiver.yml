services:
  app:
    image: quarkus-receiver:zap-security-gate
    build:
      context: ${GITHUB_WORKSPACE}/services/quarkus-receiver
      dockerfile: Dockerfile
    environment:
      BENCHMARK_DELIVERY_MODE: http-only
      JAVA_OPTS: -Xmx384m -Xms128m
    expose:
      - "8080"
    healthcheck:
      # Inherit the image's HTTP probe; allow extra startup time in CI.
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp-server:
    depends_on:
      app:
        condition: service_healthy
