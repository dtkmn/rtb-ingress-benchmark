# Supply-chain audit: checks known CVEs in dependencies for the lightweight
# ecosystems. Maven/Java OWASP Dependency-Check is intentionally excluded for
# now because anonymous NVD updates are too slow/flaky for PR gating.
# This complements CodeQL (which audits your own code) and Dependabot (which
# opens update PRs). These tools audit the *transitive dependency graph* for
# published advisories, giving immediate blocking feedback on PRs.

name: Supply Chain Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'services/**/package.json'
      - 'services/**/package-lock.json'
      - 'services/**/pyproject.toml'
      - 'services/**/uv.lock'
      - 'services/**/go.mod'
      - 'services/**/go.sum'
      - 'services/**/Cargo.toml'
      - 'services/**/Cargo.lock'
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC — complements Dependabot's weekly sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Lightweight supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Keep the quick checks sequential so the first real failure stops the job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/node-receiver/package-lock.json

      - name: Install dependencies
        working-directory: services/node-receiver
        run: npm ci --ignore-scripts

      - name: OSV-Scanner (node-receiver)
        # `npm audit` hits npm's own advisory bulk endpoint, which has proven
        # unreliable (503s / hangs) even across retries. OSV-Scanner queries
        # the OSV.dev database directly against package-lock.json instead,
        # which is far more stable and doesn't depend on the npm registry at
        # all for the vulnerability lookup.
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=services/node-receiver/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/go-receiver/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        working-directory: services/go-receiver
        run: govulncheck ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.6"

      - name: Install pip-audit
        # pip-audit is the PyPA-blessed tool; safety requires an API key since v3
        run: pip install pip-audit --quiet

      - name: Export locked requirements
        working-directory: services/python-receiver
        # --no-emit-project excludes the local package itself (whose
        # requires-python metadata may differ from the audit runner's
        # interpreter) — we only want to audit its third-party dependencies.
        run: uv export --frozen --no-hashes --no-editable --no-emit-project -o requirements-audit.txt

      - name: pip-audit
        working-directory: services/python-receiver
        run: pip-audit -r requirements-audit.txt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: cargo audit
        working-directory: services/rust-receiver
        # --deny warnings turns advisories into a hard failure.
        # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames) is ignored:
        # h2 0.3.x is pulled transitively via actix-http, which has not yet
        # migrated to h2 0.4.x (the only line with a fix) even at its latest
        # release (3.13.5). No upgrade path exists upstream as of writing.
        # Remove this ignore once actix-http bumps its h2 dependency.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0258
