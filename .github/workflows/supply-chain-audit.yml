# Supply-chain audit: checks known CVEs in dependencies across all services.
# Java uses Maven-resolved CycloneDX SBOMs with OSV-Scanner, avoiding slow
# anonymous NVD database updates while respecting platform BOMs and overrides.
# This complements CodeQL (which audits your own code) and Dependabot (which
# opens update PRs). These tools audit the *transitive dependency graph* for
# published advisories, giving immediate blocking feedback on PRs.

name: Supply Chain Audit

on:
  push:
    branches: ["main"]
    paths:
      - 'services/**/pom.xml'
      - 'services/**/.mvn/**'
      - 'services/**/mvnw'
      - '.java-version'
      - '.github/workflows/supply-chain-audit.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'services/**/package.json'
      - 'services/**/package-lock.json'
      - 'services/**/pyproject.toml'
      - 'services/**/uv.lock'
      - 'services/**/go.mod'
      - 'services/**/go.sum'
      - 'services/**/Cargo.toml'
      - 'services/**/Cargo.lock'
      - 'services/**/pom.xml'
      - 'services/**/.mvn/**'
      - 'services/**/mvnw'
      - '.java-version'
      - '.github/workflows/supply-chain-audit.yml'
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC — complements Dependabot's weekly sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-audit:
    name: Java dependency audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - quarkus-receiver
          - quarkus-sinker
          - spring-receiver
          - spring-virtual-receiver
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: |
            services/${{ matrix.service }}/pom.xml
            services/${{ matrix.service }}/.mvn/wrapper/maven-wrapper.properties

      - name: Resolve Java dependencies
        # Scan Maven's actual dependency graph, including transitive and test
        # dependencies, instead of estimating versions from the POM alone.
        run: |
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom \
            -DoutputFormat=json \
            -DincludeTestScope=true \
            -Dcyclonedx.skipAttach=true
          # OSV's action can accept an empty scan; reject incomplete SBOMs first.
          python3 - <<'PY'
          import json
          from pathlib import Path

          bom = json.loads(Path("target/bom.json").read_text())
          components = bom.get("components", [])
          if bom.get("bomFormat") != "CycloneDX" or not components or any(
              not c.get("version") or not c.get("purl", "").startswith("pkg:maven/") for c in components
          ):
              raise SystemExit("SBOM must contain resolved Maven dependencies with package URLs")
          print(f"Resolved {len(components)} Maven dependencies for scanning")
          PY

      - name: OSV-Scanner (${{ matrix.service }})
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=services/${{ matrix.service }}/target/bom.json

  audit:
    name: Lightweight supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Keep the quick checks sequential so the first real failure stops the job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/node-receiver/package-lock.json

      - name: Install dependencies
        working-directory: services/node-receiver
        run: npm ci --ignore-scripts

      - name: OSV-Scanner (node-receiver)
        # `npm audit` hits npm's own advisory bulk endpoint, which has proven
        # unreliable (503s / hangs) even across retries. OSV-Scanner queries
        # the OSV.dev database directly against package-lock.json instead,
        # which is far more stable and doesn't depend on the npm registry at
        # all for the vulnerability lookup.
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=services/node-receiver/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: services/go-receiver/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        working-directory: services/go-receiver
        run: govulncheck ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      - name: Install pip-audit
        # pip-audit is the PyPA-blessed tool; safety requires an API key since v3
        run: pip install pip-audit --quiet

      - name: Export locked requirements
        working-directory: services/python-receiver
        # --no-emit-project excludes the local package itself (whose
        # requires-python metadata may differ from the audit runner's
        # interpreter) — we only want to audit its third-party dependencies.
        run: uv export --frozen --no-hashes --no-editable --no-emit-project -o requirements-audit.txt

      - name: pip-audit
        working-directory: services/python-receiver
        run: pip-audit -r requirements-audit.txt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: cargo audit
        working-directory: services/rust-receiver
        # --deny warnings turns advisories into a hard failure.
        run: cargo audit --deny warnings
